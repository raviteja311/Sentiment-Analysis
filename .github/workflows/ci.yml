name: CI

on:
  push:
    branches: [main]
  pull_request:

# The large weights are not in git at all - they live on the Hugging Face Hub
# and are fetched on demand. CI deliberately does not fetch them, so it runs
# against exactly what a fresh clone provides: the small artifacts only. That
# exercises the path that matters most - the Logistic Regression model still
# serves predictions, while the neural models report themselves unavailable
# instead of crashing.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: pip install ruff==0.16.8 black==26.5.1

      - name: Ruff
        run: ruff check src api tests app

      - name: Black
        run: black --check src api tests app

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/dev.lock

      - name: Run tests
        run: pytest -q

  test-with-weights:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/dev.lock

      # Keyed on the manifest, so the 574 MB download happens once per
      # published set of weights.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            models/lstm/model_final.keras
            models/gru/model_final.keras
            models/roberta/model.safetensors
          key: weights-${{ hashFiles('models/remote_manifest.json') }}

      - name: Fetch weights
        run: python -m src.artifacts

      # src.artifacts only verifies files it downloads; files restored from
      # the cache are skipped, so check every file here.
      - name: Verify weights against the manifest
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib
          manifest = json.load(open("models/remote_manifest.json"))
          for relative, expected in manifest["files"].items():
              digest = hashlib.sha256()
              with open(pathlib.Path("models", relative), "rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
              actual = digest.hexdigest()
              assert actual == expected, f"{relative}: sha256 {actual} != manifest {expected}"
          print(f"all {len(manifest['files'])} weights files match the manifest")
          EOF

      - name: Run the full suite, no skips allowed
        run: |
          pytest -rs --junitxml=report.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("report.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          skipped = int(suite.get("skipped", 0))
          assert skipped == 0, f"{skipped} tests skipped with the weights present"
          print(f"{suite.get('tests')} tests, 0 skipped")
          EOF

  container:
    runs-on: ubuntu-latest
    needs: [lint, test, test-with-weights]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build the CPU image
        run: docker build --target cpu -t sentiment-analysis-api:ci .

      # models/lr/pipeline.joblib is an ordinary git blob, so the LR model is
      # genuinely servable here. The .keras and .safetensors weights are not in
      # git at all (they are fetched from the Hub), so those models are not.
      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 sentiment-analysis-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Liveness
        run: curl -sf http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Readiness reports the LR model
        run: curl -sf http://localhost:8000/ready | grep -q '"lr"'

      - name: A real prediction round-trips through the image
        run: |
          predict() {
            curl -sf -X POST http://localhost:8000/predict \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$1\",\"model\":\"lr\"}"
          }
          positive=$(predict "this is fantastic")
          negative=$(predict "absolutely awful, i hate it")
          echo "$positive"
          echo "$negative"
          echo "$positive" | grep -q '"label":"positive"'
          echo "$negative" | grep -q '"label":"negative"'

      - name: Predictions carry the version of the artifact that made them
        run: |
          body=$(curl -sf -X POST http://localhost:8000/predict             -H 'Content-Type: application/json'             -d '{"text":"this is fantastic","model":"lr"}')
          echo "$body"
          echo "$body" | grep -qE '"version":"[0-9a-f]{12}"'
          curl -sf http://localhost:8000/models | grep -q '"version"'

      - name: Rate limiting throttles callers but never the probes
        run: |
          docker rm -f api
          docker run -d --name api -p 8000:8000 -e RATE_LIMIT=3/minute             sentiment-analysis-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          for _ in $(seq 1 3); do
            curl -s -o /dev/null -X POST http://localhost:8000/predict               -H 'Content-Type: application/json'               -d '{"text":"hello","model":"lr"}'
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST             http://localhost:8000/predict -H 'Content-Type: application/json'             -d '{"text":"hello","model":"lr"}')
          echo "4th /predict -> $code"
          test "$code" = "429"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = "200"

      - name: The text budget charges a batch per text
        run: |
          docker rm -f api
          docker run -d --name api -p 8000:8000 -e TEXT_RATE_LIMIT=300/minute \
            sentiment-analysis-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          texts=$(python3 -c 'import json; print(json.dumps(["good day"] * 256))')
          batch() {
            curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://localhost:8000/predict/batch -H 'Content-Type: application/json' \
              -d "{\"texts\":$texts,\"model\":\"lr\"}"
          }
          first=$(batch)
          second=$(batch)
          echo "1st batch of 256 -> $first, 2nd -> $second"
          test "$first" = "200"
          test "$second" = "429"
          # A rejected batch consumes nothing, so a single text still fits.
          single=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"text":"hello","model":"lr"}')
          echo "single /predict after the rejected batch -> $single"
          test "$single" = "200"

      - name: Models without fetched weights are reported, not hidden
        run: |
          body=$(curl -sf http://localhost:8000/models)
          echo "$body"
          echo "$body" | grep -q 'make fetch-weights'

      - name: Readiness degrades to 503 when no artifacts are present at all
        run: |
          mkdir -p /tmp/no-models
          docker run -d --name api-empty -p 8001:8000 \
            -v /tmp/no-models:/app/models:ro sentiment-analysis-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            sleep 2
          done
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/ready)
          predict=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8001/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"hi","model":"lr"}')
          echo "GET /ready -> $ready, POST /predict -> $predict"
          test "$ready" = "503"
          test "$predict" = "503"

      - name: Container logs
        if: always()
        run: docker logs api

      - name: Stop the containers
        if: always()
        run: docker rm -f api api-empty
