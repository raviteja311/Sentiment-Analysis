name: CI

on:
  push:
    branches: [main]
  pull_request:

# The large weights are not in git at all - they live on the Hugging Face Hub
# and are fetched on demand. CI deliberately does not fetch them, so it runs
# against exactly what a fresh clone provides: the small artifacts only. That
# exercises the path that matters most - the Logistic Regression model still
# serves predictions, while the neural models report themselves unavailable
# instead of crashing.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: pip install ruff==0.16.8 black==26.5.1

      - name: Ruff
        run: ruff check src api tests app

      - name: Black
        run: black --check src api tests app

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/dev.txt

      - name: Run tests
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build the CPU image
        run: docker build --target cpu -t sentiment-analysis-api:ci .

      # models/lr/pipeline.joblib predates *.joblib being tracked by LFS, so it
      # is a real blob and the LR model is genuinely servable here. The .keras
      # and .safetensors weights are stubs, so those models are not.
      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 sentiment-analysis-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Liveness
        run: curl -sf http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Readiness reports the LR model
        run: curl -sf http://localhost:8000/ready | grep -q '"lr"'

      - name: A real prediction round-trips through the image
        run: |
          predict() {
            curl -sf -X POST http://localhost:8000/predict \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$1\",\"model\":\"lr\"}"
          }
          positive=$(predict "this is fantastic")
          negative=$(predict "absolutely awful, i hate it")
          echo "$positive"
          echo "$negative"
          echo "$positive" | grep -q '"label":"positive"'
          echo "$negative" | grep -q '"label":"negative"'

      - name: Predictions carry the version of the artifact that made them
        run: |
          body=$(curl -sf -X POST http://localhost:8000/predict             -H 'Content-Type: application/json'             -d '{"text":"this is fantastic","model":"lr"}')
          echo "$body"
          echo "$body" | grep -qE '"version":"[0-9a-f]{12}"'
          curl -sf http://localhost:8000/models | grep -q '"version"'

      - name: Models without fetched weights are reported, not hidden
        run: |
          body=$(curl -sf http://localhost:8000/models)
          echo "$body"
          echo "$body" | grep -q 'make fetch-weights'

      - name: Readiness degrades to 503 when no artifacts are present at all
        run: |
          mkdir -p /tmp/no-models
          docker run -d --name api-empty -p 8001:8000 \
            -v /tmp/no-models:/app/models:ro sentiment-analysis-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            sleep 2
          done
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/ready)
          predict=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8001/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"hi","model":"lr"}')
          echo "GET /ready -> $ready, POST /predict -> $predict"
          test "$ready" = "503"
          test "$predict" = "503"

      - name: Container logs
        if: always()
        run: docker logs api

      - name: Stop the containers
        if: always()
        run: docker rm -f api api-empty
