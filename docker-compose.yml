# Local stack: the API and the Streamlit UI from one image.
#
#   docker compose up --build
#
# Both services mount ./models read-only, so swapping in a retrained artifact
# does not mean rebuilding a multi-gigabyte image.

services:
  api:
    build:
      context: .
      target: cpu
    image: sentiment-analysis-api:local
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: .
      target: cpu
    image: sentiment-analysis-api:local
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      - api
    restart: unless-stopped
