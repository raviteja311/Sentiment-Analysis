<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" style="max-width: 480px; height: auto" role="img" aria-labelledby="t d">
<title id="t">Reliability diagram: Twitter-RoBERTa (base, not fine-tuned)</title>
<desc id="d">Test split. Fitted T = 1.00 (no softening); ECE 0.022. Points below the dashed diagonal are overconfident.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; font: 600 14px system-ui, sans-serif; }
  .ink-2 { fill: #52514e; font: 12px system-ui, sans-serif; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #8a8984; stroke-width: 1; }
  .ideal { stroke: #8a8984; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
  .s1 { stroke: #2a78d6; fill: #2a78d6; }
  .s2 { stroke: #eb6834; fill: #eb6834; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .dot { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #ffffff; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; }
    .s1 { stroke: #3987e5; fill: #3987e5; }
    .s2 { stroke: #d95926; fill: #d95926; }
    .dot { stroke: #1a1a19; }
  }
</style>
