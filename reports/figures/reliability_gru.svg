<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" style="max-width: 480px; height: auto" role="img" aria-labelledby="t d">
<title id="t">Reliability diagram: Bi-GRU</title>
<desc id="d">Test split. T = 1.12 fitted on validation; ECE 0.032 to 0.024. Points below the dashed diagonal are overconfident.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; font: 600 14px system-ui, sans-serif; }
  .ink-2 { fill: #52514e; font: 12px system-ui, sans-serif; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
