<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" style="max-width: 480px; height: auto" role="img" aria-labelledby="t d">
<title id="t">Reliability diagram: Bi-LSTM</title>
<desc id="d">Test split. T = 1.11 fitted on validation; ECE 0.031 to 0.019. Points below the dashed diagonal are overconfident.</desc>
<style>
  .surface { fill: #fcfcfb; }
