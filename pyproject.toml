[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 90
target-version = ["py312"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The app inserts the project root on sys.path before importing anything from
# src, so its imports cannot all sit at the top of the file.
"app/streamlit_app.py" = ["E402"]
"tests/conftest.py" = ["E402"]
